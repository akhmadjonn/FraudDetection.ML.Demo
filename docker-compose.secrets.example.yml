version: '3.8'

services:
  frauddetection-ml:
    image: frauddetection-ml:latest
    container_name: frauddetection-ml
    restart: unless-stopped

    # ==================== ENVIRONMENT VARIABLES (SECRETS) ====================
    environment:
      # ASP.NET Core Environment
      - ASPNETCORE_ENVIRONMENT=Production

      # ClickHouse Connection (SENSITIVE)
      - ConnectionStrings__ClickHouse=Host=clickhouse;Port=8123;Database=fraud_detection;Username=fraud_user;Password=YOUR_SECURE_PASSWORD

      # Notification Services (SENSITIVE)
      - Notifications__TeamsWebhook=https://outlook.office.com/webhook/YOUR-PRODUCTION-WEBHOOK
      - Notifications__TelegramBotToken=YOUR_TELEGRAM_BOT_TOKEN
      - Notifications__TelegramChatId=YOUR_TELEGRAM_CHAT_ID

      # ML Settings (Optional overrides)
      - ML__TrainingIntervalHours=6
      - ML__MinSessionsForTraining=1000
      - ML__ScoringIntervalSeconds=10

    # ==================== VOLUMES ====================
    volumes:
      # Persist ML models
      - ./Models:/app/Models
      # Persist logs
      - ./logs:/var/log/frauddetection

    # ==================== NETWORKING ====================
    networks:
      - fraud-detection-network

    # ==================== DEPENDS ON ====================
    depends_on:
      - clickhouse

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=fraud_detection
      - CLICKHOUSE_USER=fraud_user
      - CLICKHOUSE_PASSWORD=YOUR_SECURE_PASSWORD
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - fraud-detection-network
    ports:
      - "8123:8123"
      - "9000:9000"

networks:
  fraud-detection-network:
    driver: bridge

volumes:
  clickhouse-data:
