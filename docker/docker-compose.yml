version: '3.8'

services:
  fraud-detection-ml:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: fraud-detection-ml-host
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_ENVIRONMENT=Production
    volumes:
      - ../deploy/prod/appsettings.Production.json:/app/appsettings.Production.json:ro
      - ml-models:/app/Models
      - logs:/var/log/frauddetection
    networks:
      - fraud-detection-network
    depends_on:
      - clickhouse
    mem_limit: 4g
    cpus: 2

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    environment:
      - CLICKHOUSE_DB=fraud_detection
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=changeme
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    networks:
      - fraud-detection-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  ml-models:
    driver: local
  logs:
    driver: local
  clickhouse-data:
    driver: local
  clickhouse-logs:
    driver: local

networks:
  fraud-detection-network:
    driver: bridge
