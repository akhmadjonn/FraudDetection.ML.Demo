apiVersion: v1
kind: Secret
metadata:
  name: frauddetection-secrets
  namespace: default
type: Opaque
stringData:
  # ==================== DATABASE CONNECTION ====================
  ConnectionStrings__ClickHouse: "Host=clickhouse-service;Port=8123;Database=fraud_detection;Username=fraud_user;Password=YOUR_SECURE_PASSWORD"

  # ==================== NOTIFICATION SERVICES ====================
  Notifications__TeamsWebhook: "https://outlook.office.com/webhook/YOUR-PRODUCTION-WEBHOOK"
  Notifications__TelegramBotToken: "YOUR_TELEGRAM_BOT_TOKEN"
  Notifications__TelegramChatId: "YOUR_TELEGRAM_CHAT_ID"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frauddetection-config
  namespace: default
data:
  # ==================== ML SETTINGS (Non-sensitive) ====================
  ML__TrainingIntervalHours: "6"
  ML__MinSessionsForTraining: "1000"
  ML__ScoringIntervalSeconds: "10"
  ML__ScoringBatchSize: "100"
  ML__DailyReportHour: "8"

  # ==================== ALERT SETTINGS (Non-sensitive) ====================
  Alerts__EnableDatabasePersistence: "true"
  Alerts__DefaultThrottleWindowMinutes: "60"

  # ==================== ASPNETCORE ENVIRONMENT ====================
  ASPNETCORE_ENVIRONMENT: "Production"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frauddetection-ml
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frauddetection-ml
  template:
    metadata:
      labels:
        app: frauddetection-ml
    spec:
      containers:
      - name: frauddetection-ml
        image: frauddetection-ml:latest
        imagePullPolicy: Always

        # ==================== ENVIRONMENT FROM SECRETS ====================
        envFrom:
        - secretRef:
            name: frauddetection-secrets
        - configMapRef:
            name: frauddetection-config

        # ==================== VOLUMES ====================
        volumeMounts:
        - name: models
          mountPath: /app/Models
        - name: logs
          mountPath: /var/log/frauddetection

        # ==================== RESOURCES ====================
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: frauddetection-models-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: frauddetection-logs-pvc
